name: Aplicar Android actualizado y SQL local seguro

on:
  push:
    paths:
      - 'actualizacion_comunimap_local.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio local
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Aplicar paquete subido
        run: |
          set -Eeuo pipefail
          if [ ! -f actualizacion_comunimap_local.zip ]; then
            echo "No hay paquete nuevo; no se modifica nada."
            exit 0
          fi
          rm -rf /tmp/cm-actualizacion
          mkdir -p /tmp/cm-actualizacion
          unzip -q actualizacion_comunimap_local.zip -d /tmp/cm-actualizacion
          test -f /tmp/cm-actualizacion/android/app/build.gradle.kts
          test -f /tmp/cm-actualizacion/android/app/src/main/java/com/example/comunimap/screens/ComunidadScreen.kt
          test -f /tmp/cm-actualizacion/database/esquema_local.sql
          # Nunca copiar credenciales ni datos reales del dump; conservar google-services.json anterior.
          test ! -e /tmp/cm-actualizacion/android/app/google-services.json
          if grep -Eq '^INSERT INTO \`(usuarios|notificaciones|reportes|dispositivos_fcm)\`' /tmp/cm-actualizacion/database/esquema_local.sql; then
            echo "ERROR: el SQL contiene registros privados." >&2
            exit 1
          fi
          mkdir -p android database
          rsync -a --delete --exclude='respaldo_anterior/' --exclude='app/google-services.json' \
            /tmp/cm-actualizacion/android/ android/
          cp /tmp/cm-actualizacion/database/esquema_local.sql database/esquema_local.sql
          cp /tmp/cm-actualizacion/database/README.md database/README.md
          # No conservar el paquete en el repositorio para evitar duplicaciones.
          rm -f actualizacion_comunimap_local.zip

      - name: Verificar y publicar solo en comunimap-local
        run: |
          set -Eeuo pipefail
          if [ -f actualizacion_comunimap_local.zip ]; then
            echo "El paquete no fue procesado correctamente" >&2
            exit 1
          fi
          test -f android/app/src/main/java/com/example/comunimap/screens/ComunidadScreen.kt
          test -f database/esquema_local.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- android database actualizacion_comunimap_local.zip
          if git diff --cached --quiet; then
            echo 'Sin cambios adicionales.'
          else
            git commit -m 'Actualizar Android desde ZIP 27 y añadir SQL local anonimizado'
            git push origin HEAD:main
          fi
